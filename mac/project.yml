# Signed with the Apple Development identity belonging to team FZC6P6XRGD
# ("Apple Development: Miguel Carvalhal"), created from a free Apple ID — no paid
# developer account involved. Note the team id is the certificate's OU field
# (FZC6P6XRGD), NOT the identifier in parentheses in its common name — Xcode matches
# DEVELOPMENT_TEAM on the OU, and using the wrong one fails with a misleading
# `No "Mac Development" signing certificate matching team ID ... found`.
#
# Why this matters beyond tidiness: macOS ties TCC permission grants to an app's
# code signature. With the previous ad-hoc signature ("-") there was no stable
# identity, so every single rebuild presented as a brand-new app and silently
# dropped the Microphone / Input Monitoring / Accessibility grants. The symptom is
# never "permission denied" — the hotkey stops firing, or the paste stops landing,
# or the mic records silence, and it looks like the app broke. A real identity keeps
# the designated requirement (team + bundle id) constant across builds, so the
# grants survive.
#
# Manual, not Automatic, and deliberately so. Automatic signing asks for a legacy
# "Mac Development" certificate; a free Apple ID issues the unified "Apple Development"
# one, so the build fails with `No "Mac Development" signing certificate ... found`.
# This app declares no entitlements and is not sandboxed, so it needs no provisioning
# profile at all — signing with the identity directly is both simpler and deterministic.
#
# If you ever need to go back to ad-hoc (a machine with no Apple ID), set on both
# targets: CODE_SIGN_IDENTITY: "-" and DEVELOPMENT_TEAM: "" — and accept re-granting
# the three TCC permissions on every build.
#
name: Voice
options:
  bundleIdPrefix: co.miraside
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.18.0
targets:
  Voice:
    type: application
    platform: macOS
    sources: [Voice]
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Voice/Info.plist
      properties:
        CFBundleDisplayName: Voice
        # Names the asset-catalog icon set. macOS needs this in Info.plist as well as
        # ASSETCATALOG_COMPILER_APPICON_NAME below — with only the build setting the icon
        # compiles into Assets.car but the Dock still shows the generic placeholder.
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Voice is a regular app now, with a dock icon and an Insights window
        # (prd-insights-dashboard.md rule 1). This and AppDelegate's
        # NSApp.setActivationPolicy(.regular) must always change together: this key is
        # read from Info.plist before any of our code runs, so the two disagreeing gives
        # a dock icon that flickers in at launch or never appears at all.
        LSUIElement: false
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "Voice records your speech while you hold the dictation key. Audio never leaves this Mac."
        NSHumanReadableCopyright: "Miraside"
    entitlements:
      path: Voice/Voice.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.miraside.voice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        # Named in full, not as the generic "Apple Development": Xcode maps that generic
        # string to the legacy "Mac Development" certificate type for macOS targets and then
        # fails with `No "Mac Development" signing certificate ... found`, even though a valid
        # unified Apple Development certificate is in the keychain.
        CODE_SIGN_IDENTITY: "Apple Development: Miguel Carvalhal (Y7F3YBR6D8)"
        DEVELOPMENT_TEAM: FZC6P6XRGD
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  VoiceTests:
    type: bundle.unit-test
    platform: macOS
    sources: [VoiceTests, { path: Fixtures, type: folder, buildPhase: resources }]
    dependencies:
      - target: Voice
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        # Named in full, not as the generic "Apple Development": Xcode maps that generic
        # string to the legacy "Mac Development" certificate type for macOS targets and then
        # fails with `No "Mac Development" signing certificate ... found`, even though a valid
        # unified Apple Development certificate is in the keychain.
        CODE_SIGN_IDENTITY: "Apple Development: Miguel Carvalhal (Y7F3YBR6D8)"
        DEVELOPMENT_TEAM: FZC6P6XRGD
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # Brief's project.yml gives VoiceTests no `info:` block and no
        # GENERATE_INFOPLIST_FILE setting; without this, code signing fails
        # with "target does not have an Info.plist file and one is not
        # being generated automatically". Not part of the signing ruling —
        # a gap in the brief needed to make the test bundle buildable.
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Voice:
    build:
      targets:
        Voice: all
        VoiceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VoiceTests]
      # VoiceTests is TEST_HOST-launched inside Voice.app, so it does not inherit the invoking
      # shell's environment (macOS-specific: unlike a standalone xctest process, an app host launch
      # does not pick up the parent process's env). This passthrough forwards VOICE_ASR_TESTS from
      # xcodebuild's own environment (itself inherited from the shell) as an explicit launch env var,
      # so `VOICE_ASR_TESTS=1 xcodebuild test …` reaches ProcessInfo.processInfo.environment in the
      # opt-in WhisperKitTranscriberTests. Resolves to empty when unset, so the test still skips.
      environmentVariables:
        VOICE_ASR_TESTS: "$(VOICE_ASR_TESTS)"
