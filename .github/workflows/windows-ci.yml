# Proves the Windows client without a Windows PC (tasks/spit-mac-windows-build-spec.md AC-3, AC-6): core
# tests on Linux and Windows, the parity check, Windows-only tests, a packed installer, a real transcription
# with the pinned model, and a silent install → run → uninstall. Never creates a release.
name: windows-ci

on:
  pull_request:
  push:
    branches: [main, spit-mac-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # The default model friends get (ModelCatalog.DefaultFile): the smoke test must prove what ships.
  MODEL_FILE: ggml-small-q8_0.bin
  MODEL_SHA256: 49c8fb02b65e6049d5fa6c04f81f53b867b5ec9540406812c643f177317f779f

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: VERSION agrees with mac/project.yml
        shell: bash
        run: scripts/check-version.sh
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Core tests
        run: dotnet test windows/Spit.Core.Tests -c Release
      - name: Parity with the Mac tests
        if: runner.os == 'Linux'
        run: windows/scripts/parity-check.sh

  app:
    needs: core
    runs-on: windows-latest
    # A hung app (a smoke test that never exits, an installer waiting on a dialog) must fail the run, not
    # hold a runner for GitHub's six-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build windows/Spit.sln -c Release

      - name: Windows-only tests
        run: dotnet test windows/Spit.App.Tests -c Release

      - name: Pack
        shell: pwsh
        run: windows/scripts/pack.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Spit-Setup
          path: windows/Releases/Spit-Setup.exe
          if-no-files-found: error

      - name: Restore the speech model
        id: model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\spit-model\${{ env.MODEL_FILE }}
          key: whisper-${{ env.MODEL_SHA256 }}

      - name: Download the speech model
        if: steps.model.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'spit-model'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$env:MODEL_FILE" -OutFile (Join-Path $dir $env:MODEL_FILE)

      - name: Smoke test — transcribe a fixture with the published app (auto and CPU runtimes)
        timeout-minutes: 30
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP "spit-model\$env:MODEL_FILE"
          $hash = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MODEL_SHA256) { throw "model hash $hash does not match the pin" }
          $data = Join-Path $env:RUNNER_TEMP 'spit-data'
          New-Item -ItemType Directory -Force (Join-Path $data 'models') | Out-Null
          Copy-Item $model (Join-Path $data "models\$env:MODEL_FILE")
          $env:SPIT_DATA_DIR = $data
          "| runtime asked | runtime loaded | audio ms | one-pass ms | live ms | whole-pass fallback | text | live text |`n|---|---|---|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          $failures = @()
          # `auto` is what friends get (Vulkan first); `cpu` is the comparison the runtime order is judged by.
          foreach ($runtime in @('auto', 'cpu')) {
            $env:SPIT_WHISPER_RUNTIME = if ($runtime -eq 'auto') { '' } else { $runtime }
            $report = Join-Path $env:RUNNER_TEMP "smoke-$runtime.json"
            $p = Start-Process -FilePath windows/publish/Spit.exe -ArgumentList @('--smoke-test', (Resolve-Path mac/Fixtures/en.wav), '--report', $report) -PassThru -Wait -NoNewWindow
            if (-not (Test-Path $report)) { $failures += "${runtime}: no report (exit $($p.ExitCode))"; continue }
            "--- smoke report ($runtime) ---"
            Get-Content $report
            $r = Get-Content $report -Raw | ConvertFrom-Json
            "| $runtime | $($r.runtime) | $($r.audioMs) | $($r.transcribeMs) | $($r.streamMs) | $($r.wholePassFallback) | $($r.text) | $($r.streamedText) |" >> $env:GITHUB_STEP_SUMMARY
            if ($p.ExitCode -ne 0 -or -not $r.ok) { $failures += "${runtime}: $($r.error)"; continue }
            if ([string]::IsNullOrWhiteSpace($r.streamedText)) { $failures += "${runtime}: the live path produced no text"; continue }
            # The live path must say what the one pass said: the same opening, no word pasted twice, about the same
            # length, the fixture's words. Normalised like Stitch (letters and digits), so punctuation cannot hide a
            # repeat — an earlier check trimmed only the ends and passed "Hi Joel, Joel, …".
            $norm = { param($t) @(($t.ToLowerInvariant() -replace '[^\p{L}\p{N}\s]', '') -split '\s+' | Where-Object { $_ }) }
            $once = & $norm $r.text
            $live = & $norm $r.streamedText
            # Any phrase of 1-5 words said twice back to back ("on Convex on Convex") that the one pass does not have:
            # a failed stitch repeats the ~1.5 s overlap, three or four words — an earlier check compared single words
            # only and passed exactly those.
            $doubledIn = {
              param([string[]] $w)
              $found = @{}
              for ($n = 1; $n -le 5; $n++) {
                for ($k = 0; $k + 2 * $n -le $w.Count; $k++) {
                  $a = $w[$k..($k + $n - 1)] -join ' '
                  $b = $w[($k + $n)..($k + 2 * $n - 1)] -join ' '
                  if ($a -eq $b) { $found[$a] = $true }
                }
              }
              $found
            }
            $onceDoubled = & $doubledIn $once
            foreach ($phrase in (& $doubledIn $live).Keys) {
              if (-not $onceDoubled.ContainsKey($phrase)) { $failures += "${runtime}: live text repeats '$phrase'" }
            }
            $n = [Math]::Min(3, $once.Count)
            $liveOpening = ($live | Select-Object -First $n) -join ' '
            $onceOpening = ($once | Select-Object -First $n) -join ' '
            if ($liveOpening -ne $onceOpening) { $failures += "${runtime}: live text opens '$liveOpening', one pass '$onceOpening'" }
            if ($live.Count -gt $once.Count + 2) { $failures += "${runtime}: live text has $($live.Count) words, one pass $($once.Count)" }
            if ($r.streamedText -notmatch 'mira|convex|olama') { $failures += "${runtime}: live text lacks the fixture's words" }
          }
          if ($failures.Count -gt 0) { throw ($failures -join '; ') }

      - name: Install, run, second instance, uninstall
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Resolve-Path windows/Releases/Spit-Setup.exe
          $install = Join-Path $env:LOCALAPPDATA 'Spit'
          $data = Join-Path $env:LOCALAPPDATA 'Miraside\Spit'

          $p = Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru -Wait
          "setup exit $($p.ExitCode)"
          # Velopack installs a stable launcher at the root and the real app under current\. The launcher starts
          # the app and exits, so process checks must watch current\Spit.exe, not the launcher.
          $stub = Join-Path $install 'Spit.exe'
          $exe = Join-Path $install 'current\Spit.exe'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $stub); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $stub)) { throw "$stub was not installed" }
          if (-not (Test-Path $exe)) { throw "$exe was not installed" }
          if (-not (Test-Path (Join-Path $install 'Update.exe'))) { throw 'Velopack Update.exe missing' }
          Get-ChildItem $install | Format-Table Name, Length

          Get-Process Spit -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          # Earlier steps on this runner (the Windows-only tests, Velopack's post-install launch) may already have
          # written a log, a "ready" line or the data folder itself; every check below must see only this launch.
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep 15
          $app.Refresh()
          if ($app.HasExited) { throw "Spit exited after start with code $($app.ExitCode)" }
          if (-not (Test-Path $data)) { throw "$data was not created by the running app" }
          # Alive is not enough: a UI that fails to build leaves a process with a hotkey and no tray, bar or windows.
          $logFile = Get-ChildItem (Join-Path $data 'logs') -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $logFile) { throw 'the running app wrote no log' }
          $logText = Get-Content $logFile.FullName -Raw
          if ($logText -match ' fatal \[') { '--- app log ---'; $logText; throw 'the app logged a crash' }
          if ($logText -notmatch 'tray, bar and windows ready') { '--- app log ---'; $logText; throw 'the UI did not finish starting' }

          $second = Start-Process -FilePath $exe -PassThru
          if (-not $second.WaitForExit(10000)) { throw 'a second Spit did not exit within 10 s (single instance broken)' }
          "second instance exit $($second.ExitCode)"
          if ($second.ExitCode -ne 0) { throw "second instance exited with $($second.ExitCode)" }

          # The launcher path friends use (Start menu, desktop, Run key) must also end in one instance.
          Start-Process -FilePath $stub | Out-Null
          Start-Sleep 8
          $app.Refresh()
          if ($app.HasExited) { throw 'the first Spit exited when another launched' }
          $running = @(Get-Process Spit -ErrorAction SilentlyContinue)
          "Spit processes after launcher: $($running.Count)"
          if ($running.Count -ne 1) { throw "expected one Spit process, found $($running.Count)" }

          '--- app log ---'
          Get-Content $logFile.FullName
          if ((Get-Content $logFile.FullName -Raw) -match ' fatal \[') { throw 'the app logged a crash during the instance checks' }

          Get-Process Spit -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $u = Start-Process -FilePath (Join-Path $install 'Update.exe') -ArgumentList @('--uninstall', '--silent') -PassThru -Wait
          "uninstall exit $($u.ExitCode)"
          for ($i = 0; $i -lt 30 -and ((Test-Path $exe) -or (Test-Path $stub)); $i++) { Start-Sleep 1 }
          if ((Test-Path $exe) -or (Test-Path $stub)) { throw 'Spit is still installed after uninstall' }
          if (-not (Test-Path $data)) { throw "uninstall removed $data (rule 5)" }
          'install/uninstall OK'
